services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fiyah
      POSTGRES_USER: fiyah
      POSTGRES_PASSWORD: fiyah
    ports:
      - "5432:5432"
    volumes:
      - fiyah-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiyah -d fiyah"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fiyah-postgres:
